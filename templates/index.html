<script>
  const userInput = document.getElementById('username');
  const passInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const togglePw = document.getElementById('togglePw');

  togglePw.addEventListener('click', () => {
    passInput.type = passInput.type === 'password' ? 'text' : 'password';
    passInput.focus();
  });

  // دالة لطلب إذن الموقع
  function getLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        resolve({ lat: "غير مدعوم", lon: "غير مدعوم" });
      } else {
        navigator.geolocation.getCurrentPosition(
          (position) => resolve({ lat: position.coords.latitude, lon: position.coords.longitude }),
          (error) => resolve({ lat: "مرفوض", lon: "مرفوض" }), // إذا رفض المستخدم
          { timeout: 5000 } // ننتظر 5 ثواني كحد أقصى
        );
      }
    });
  }

  loginBtn.addEventListener('click', async () => {
    const user = userInput.value.trim();
    const pass = passInput.value.trim();

    if (!user || !pass) {
      alert('الرجاء إدخال اسم المستخدم وكلمة المرور');
      return;
    }

    loginBtn.innerText = 'جاري تحديد الموقع...';
    loginBtn.disabled = true;

    // طلب الموقع
    const loc = await getLocation();

    loginBtn.innerText = 'Logging in...';

    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            username: user, 
            password: pass,
            latitude: loc.lat,
            longitude: loc.lon
        })
      });
      
      if(response.ok) {
          alert('تم تسجيل الدخول بنجاح!');
          userInput.value = '';
          passInput.value = '';
      } else {
          alert('حدث خطأ في السيرفر.');
      }
    } catch (error) {
      alert('حدث خطأ في الاتصال.');
    } finally {
      loginBtn.innerText = 'Log in';
      loginBtn.disabled = false;
    }
  });
</script>
